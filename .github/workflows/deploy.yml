name: Build Push Deploy

on:
  push:
    branches:
      - main
      - master

env:
  BACKEND_IMAGE: ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/backend
  FRONTEND_IMAGE: ${{ secrets.SWR_REGISTRY }}/${{ secrets.SWR_ORG }}/frontend
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Huawei SWR
        run: |
          echo "${{ secrets.SWR_PASSWORD }}" | docker login ${{ secrets.SWR_REGISTRY }} \
            -u "${{ secrets.SWR_USERNAME }}" \
            --password-stdin

      - name: Build backend image
        run: |
          docker build -t $BACKEND_IMAGE:$IMAGE_TAG ./backend

      - name: Build frontend image
        run: |
          docker build -t $FRONTEND_IMAGE:$IMAGE_TAG ./frontend

      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:$IMAGE_TAG

      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:$IMAGE_TAG

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Update Kubernetes deployments
        run: |
          kubectl set image deployment/backend-api flask-api=$BACKEND_IMAGE:$IMAGE_TAG
          kubectl set image deployment/frontend-ui nginx-frontend=$FRONTEND_IMAGE:$IMAGE_TAG
          kubectl rollout status deployment/backend-api --timeout=180s
          kubectl rollout status deployment/frontend-ui --timeout=180s

      - name: Verify image update
        run: |
          kubectl get deployment backend-api frontend-ui -o wide
          kubectl get deployment backend-api -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'
          kubectl get deployment frontend-ui -o jsonpath='{.spec.template.spec.containers[0].image}{"\n"}'