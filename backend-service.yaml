apiVersion: v1
kind: Service
metadata:
  name: backend-loadbalancer
  annotations:
    # ⚠️ 关键要求：添加此注解自动创建并绑定华为云弹性负载均衡 ELB
    kubernetes.io/elb.class: union
    kubernetes.io/elb.autocreate: '{"type":"num","bandwidth_type":"traffic","bandwidth_size":5,"share_type":"PER","charge_mode":"traffic"}'
spec:
  type: LoadBalancer           # ⚠️ 关键要求：类型 LoadBalancer
  ports:
  - port: 80                   # 外部访问端口
    targetPort: 5000           # 映射到 Flask 容器的 5000 端口
  selector:
    app: backend