apiVersion: "kubeflow.org/v1"
kind: PyTorchJob
metadata:
  name: mnist-ddp-job
  namespace: default
spec:
  pytorchReplicaSpecs:
    Master:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: swr.cn-north-4.myhuaweicloud.com/zmh2482/mnist-ddp:v4
              imagePullPolicy: Always
              args:
                - "--epochs"
                - "2"
                - "--batch-size"
                - "64"
                - "--data-dir"
                - "/workspace/data"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "2Gi"

    Worker:
      replicas: 1
      restartPolicy: OnFailure
      template:
        spec:
          containers:
            - name: pytorch
              image: swr.cn-north-4.myhuaweicloud.com/zmh2482/mnist-ddp:v4
              imagePullPolicy: Always
              args:
                - "--epochs"
                - "2"
                - "--batch-size"
                - "64"
                - "--data-dir"
                - "/workspace/data"
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "2Gi"