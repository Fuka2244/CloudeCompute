apiVersion: kubeflow.org/v2beta1
kind: MPIJob
metadata:
  name: integral-mpi-p1
  namespace: default
spec:
  slotsPerWorker: 1
  runPolicy:
    cleanPodPolicy: Running
  mpiReplicaSpecs:
    Launcher:
      replicas: 1
      template:
        spec:
          imagePullSecrets:
          - name: swr-secret
          containers:
          - name: launcher
            image: swr.cn-north-4.myhuaweicloud.com/lxy2418/mpi4py:latest
            command:
            - mpirun
            - -n
            - "1"
            - python
            - /opt/mpi/integral_mpi.py
            volumeMounts:
            - name: mpi-code
              mountPath: /opt/mpi
          volumes:
          - name: mpi-code
            configMap:
              name: mpi-code
    Worker:
      replicas: 1
      template:
        spec:
          imagePullSecrets:
          - name: swr-secret
          containers:
          - name: worker
            image: swr.cn-north-4.myhuaweicloud.com/lxy2418/mpi4py:latest
            resources:
              requests:
                cpu: "500m"
                memory: "512Mi"
            volumeMounts:
            - name: mpi-code
              mountPath: /opt/mpi
          volumes:
          - name: mpi-code
            configMap:
              name: mpi-code
